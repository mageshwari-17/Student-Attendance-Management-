<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Student - Attendify</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        background: #f4f5fb;
        font-family: Arial, sans-serif;
      }

      .heading {
        background: linear-gradient(120deg, #4933a5, #8065e8);
        color: white;
        padding: 25px;
        border-radius: 15px;
        margin-bottom: 25px;
      }

      .form-card {
        background: white;
        padding: 35px;
        border-radius: 18px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      }

      .btn-purple {
        background: #4933a5;
        color: white;
      }

      .btn-purple:hover {
        background: #30216e;
        color: white;
      }
    </style>
  </head>

  <body>
    <div class="container py-5">
      <div class="heading">
        <h2>✏️ Edit Student Details</h2>
        <p class="mb-0">Update student information.</p>
      </div>

      <div class="form-card">
        {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        <form method="POST" id="editForm">
          {% csrf_token %}

          <label class="form-label">Student Name</label>
          <input
            type="text"
            name="name"
            value="{{ student.name }}"
            class="form-control mb-3"
            required
          />

          <label class="form-label">Roll Number</label>
          <input
            type="text"
            name="roll_number"
            value="{{ student.roll_number }}"
            class="form-control mb-3"
            required
          />

          <label class="form-label">Department</label>
          <input
            type="text"
            name="department"
            value="{{ student.department }}"
            class="form-control mb-3"
            required
          />

          <label class="form-label">Year</label>
          <input
            type="number"
            name="year"
            value="{{ student.year }}"
            min="1"
            max="4"
            step="1"
            class="form-control mb-3"
            required
          />

          <label class="form-label">Email</label>
          <input
            type="email"
            name="email"
            value="{{ student.email }}"
            class="form-control mb-4"
            required
          />

          <button type="submit" class="btn btn-purple">Update Student</button>

          <a href="/search/" class="btn btn-secondary">Cancel</a>
        </form>
      </div>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const form = document.getElementById("editForm");

        form.addEventListener("submit", function (event) {
          const yearField = form.querySelector('[name="year"]');
          const year = Number(yearField.value);

          const name = form.querySelector('[name="name"]').value.trim();
          const roll = form.querySelector('[name="roll_number"]').value.trim();
          const department = form
            .querySelector('[name="department"]')
            .value.trim();

          if (!name || !roll || !department) {
            alert("Please fill all student details.");
            event.preventDefault();
            return;
          }

          if (!Number.isInteger(year) || year < 1 || year > 4) {
            alert("Year must be between 1 and 4.");
            event.preventDefault();
            return;
          }
        });
      });
    </script>
  </body>
</html>
